{% extends 'base.html' %}
{% block head %}
<script src="{{  url_for('static', filename='js/pred.js')  }}"></script>

{% endblock %}
{% block body %}
<div id="all_content">

    </br>
    <div class="container" >
        <!-- Nav tabs -->
        <ul class="nav nav-tabs">
            <li class="nav-item" style="padding: 5px;">
                <a class="nav-link active" data-toggle="tab" href="#home" style="color:white;background-color:#4CAF50">Sequence</a>
            </li>
            <li class="nav-item" style="padding: 5px;">
                <a class="nav-link" data-toggle="tab" href="#menu1" style="color:white;background-color:#4CAF50">File Upload</a>
            </li>
        </ul>
        <!-- Tab panes -->
        <div class="tab-content">
            <div class="tab-pane container active" id="home">
                <div style="width:50%">
                    <form action="{{  url_for('first_handler')  }}" method="POST" enctype = "multipart/form-data">

                        <div class="form-group">
                            <label for="uhml" style="color:black">UHML</label>
                            <input type="number" class="form-control" id="uhml">
                        </div>
                        <div class="form-group">
                            <label for="ui" style="color:black">UI</label>
                            <input type="number" class="form-control" id="ui">
                        </div>
                        <div class="form-group">
                            <label for="mic" style="color:black">Mic</label>
                            <input type="number" class="form-control" id="mic">
                        </div>
                        <div class="form-group">
                            <label for="str" style="color:black">Str</label>
                            <input type="number" class="form-control" id="str">
                        </div>
                        <div class="form-group">
                            <label for="e" style="color:black">E</label>
                            <input type="number" class="form-control" id="e">
                        </div>
                        <div class="form-group">
                            <label for="count" style="color:black">Count</label>
                            <input type="number" class="form-control" id="count">
                        </div>
                        <button type="submit" class="btn btn-primary" id="btn1" style="background-color:#4CAF50">Submit</button>
                    </form>
                </div>
            </div>
            <div class="tab-pane container fade" id="menu1">
                <form action="{{  url_for('second_handler')  }}" method="POST" enctype = "multipart/form-data">
                    </br>
                    <div class="form-group">
                        <label for="csv_file" style="color:black">Upload CSV File</label>
                        <input type="file" class="form-control-file" id="csv_file" name="csv_file" accept=".csv">
                        </br>
                        <a href="{{  url_for('static', filename='example_input/sample.csv')  }}" download="sample" style="color:blue">(Download Sample File)</a>
                    </div>
                    <button type="submit" class="btn btn-primary" id="btn2" style="background-color:#4CAF50">
                        <span class="display_none" id="confirm_submit_spinner_id">
                            <span class="spinner-grow spinner-grow-sm" role="status" aria-hidden="true"></span>
                            <span class="spinner-grow spinner-grow-sm" role="status" aria-hidden="true"></span>
                            <span class="spinner-grow spinner-grow-sm" role="status" aria-hidden="true"></span>
                        </span>
                                        <span id="confirm_submit_spinner_text">
                                            Submit
                                        </span>
		            </button>
                </form>
            </div>
        </div>

    </div>
    </br>
    </br>
</div>
<div class="display_none" id = "loading">
    </br>
    </br>
    <div class="text-center">
        <div class="spinner-border text-dark" style="width: 10rem; height: 10rem;" role="status">
            <span class="sr-only">Loading</span>
        </div>
        </br>
        </br>
        </br>
        <h2 style="color:black">Processing<div class="spinner-grow spinner-grow-sm text-dark"></div>
            <div class="spinner-grow spinner-grow-sm text-dark"></div>
            <div class="spinner-grow spinner-grow-sm text-dark"></div></h2>
    </div>
    </br>
    </br></br>
</div>
{% endblock %}
